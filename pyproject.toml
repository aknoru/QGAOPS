[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qgaops-qgpu"
version = "0.1.0"
description = "Requirements, mathematical specification, and Cl(3,0) reference model for QGAOPS-QGPU"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev     = ["pytest>=7,<9"]
gui     = ["PySide6>=6.6"]
cv      = ["opencv-python>=4.9", "mediapipe>=0.10"]
train   = ["numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7"]
all     = ["qgaops-qgpu[gui,cv,train,dev]"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["software*"]

[tool.pytest.ini_options]
testpaths       = ["software", "hand_ga_engine/tests"]
norecursedirs   = [".venv", "qgaops_qgpu.egg-info", "hardware", "deployment"]
